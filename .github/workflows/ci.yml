name: Validación del proyecto

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: campustrade
          POSTGRES_USER: campustrade
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U campustrade -d campustrade"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://campustrade:ci-only-password@127.0.0.1:5432/campustrade
      APP_SECRET: ci-only-ephemeral-key-at-least-32-characters
      ALLOWED_EMAIL_DOMAINS: campus.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run test:api
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
