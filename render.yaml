# Plantilla preparada; requiere cuentas Free y secretos reales antes de desplegar.
services:
  - type: web
    name: campustrade
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 24.12.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: 1
      - key: APP_SECRET
        generateValue: true
      - key: ALLOWED_EMAIL_DOMAINS
        value: itesa.edu.mx
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
# Correo pendiente por decisión del responsable. Configurar MAIL_FROM y
# RESEND_API_KEY en el panel cuando se elija proveedor; no incluir secretos aquí.
